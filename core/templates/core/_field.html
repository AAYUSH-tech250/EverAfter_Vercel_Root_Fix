<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.widget_type == 'checkbox' %}
    <label class="check">{{ field }} <span>{{ field.label }}</span></label>
  {% elif field.widget_type == 'radioselect' or field.widget_type == 'checkboxselectmultiple' %}
    <label class="lbl">{{ field.label }}</label>
    <div class="options {{ field.name }}">{{ field }}</div>
  {% else %}
    <label class="lbl" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<small class="err">{{ e }}</small>{% endfor %}
</div>
